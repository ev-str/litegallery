<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ec">
  <title>Gallery</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/collage.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-chevrons-right" viewBox="0 0 24 24"><path d="m6 17 5-5-5-5M13 17l5-5-5-5"/></symbol>
    <symbol id="icon-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="icon-minimize" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="icon-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="icon-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="icon-flip-horizontal" viewBox="0 0 24 24"><path d="m8 3-4 4 4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
    <symbol id="icon-flip-vertical" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" id="brand" href="/">Gallery</a>
    <nav id="breadcrumbs" aria-label="Путь"></nav>
    <div class="topbar-actions">
      <button id="collageMode" class="collage-entry-button" type="button" aria-label="Выбрать фотографии для коллажа">Коллаж</button>
      <button id="refresh" class="icon-button" type="button" title="Обновить" aria-label="Обновить"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-refresh"></use></svg></button>
    </div>
  </header>
  <main>
    <div id="status">Загрузка…</div>
    <section id="foldersSection" class="collection-section" hidden>
      <div class="section-heading">
        <h1>Папки</h1>
        <div class="section-tools">
          <span id="folderCount"></span>
          <button id="folderSort" class="sort-button" type="button" aria-label="Изменить порядок папок"></button>
        </div>
      </div>
      <div id="folders" class="folder-grid" aria-live="polite"></div>
    </section>
    <section id="mediaSection" class="collection-section" hidden>
      <div class="section-heading media-heading">
        <div class="media-title-row">
          <h1>Фотографии и видео</h1>
          <span id="mediaCount"></span>
        </div>
        <div class="section-tools media-tools">
          <div id="mediaFilter" class="filter-segments" aria-label="Тип файлов">
            <button type="button" data-filter="all">Все</button>
            <button type="button" data-filter="image">Фото</button>
            <button type="button" data-filter="video">Видео</button>
          </div>
          <select id="mediaSort" class="sort-select" aria-label="Сортировка файлов">
            <option value="date">По дате</option>
            <option value="name">По имени</option>
          </select>
          <button id="mediaDirection" class="sort-button direction-button" type="button" aria-label="Изменить направление сортировки"></button>
        </div>
      </div>
      <div id="mediaGrid" class="media-grid" aria-live="polite"></div>
    </section>
  </main>
  <aside id="collageSelection" class="collage-selection-bar" hidden aria-live="polite">
    <strong>Выбрано <span id="collageSelectionCount">0</span></strong>
    <span class="collage-selection-hint">Выберите от 2 до 12 фотографий</span>
    <button id="collageProjectOpen" type="button">Открыть проект</button>
    <button id="collageSelectionCancel" type="button">Отмена</button>
    <button id="collageSelectionStart" class="primary" type="button" disabled>Сделать коллаж</button>
  </aside>
  <dialog id="viewer" tabindex="-1" aria-label="Просмотр">
    <button class="viewer-button close" type="button" aria-label="Закрыть"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg></button>
    <button class="viewer-button prev" type="button" aria-label="Предыдущее"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg></button>
    <div class="stage">
      <button class="viewer-button fullscreen" type="button" aria-label="На весь экран"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-maximize"></use></svg></button>
      <button class="viewer-button info" type="button" aria-label="Информация о фотографии" title="EXIF"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-info"></use></svg></button>
      <aside class="exif-panel" hidden aria-live="polite">
        <header><strong>О фотографии</strong><button class="exif-close" type="button" aria-label="Закрыть информацию"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-x"></use></svg></button></header>
        <div class="exif-content"></div>
      </aside>
    </div>
    <button class="viewer-button next" type="button" aria-label="Следующее"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-right"></use></svg></button>
    <footer><span class="caption"></span><button class="slideshow" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-play"></use></svg><span>Слайд-шоу</span></button></footer>
  </dialog>
  <dialog id="collageEditor" class="collage-editor" aria-label="Редактор коллажа"></dialog>
  <input id="collageProjectInput" type="file" accept="application/json,application/zip,.json,.zip" hidden>
  <script src="/app.js" type="module"></script>
  <script src="/collage/editor.js" type="module"></script>
</body>
</html>
